services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-agent-app
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    env_file:
      - .env.local
    environment:
      - INNGEST_DEV=http://inngest:8288
      - INNGEST_BASE_URL=http://inngest:8288
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  inngest:
    image: node:20-alpine
    container_name: ai-video-agent-inngest
    working_dir: /app
    command: sh -c "npx inngest-cli@latest dev -u http://app:3000/api/inngest --host 0.0.0.0 --port 8288"
    depends_on:
      - app
    env_file:
      - .env.local
    environment:
      - INNGEST_DEV=1
    ports:
      - "8288:8288"
    volumes:
      - .:/app
    restart: unless-stopped
